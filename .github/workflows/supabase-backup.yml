name: Backup Supabase Bunny's INK

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular proyecto Supabase
        run: supabase link --project-ref zggngzzaxnujwbrhnabb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Crear carpeta de respaldo
        run: mkdir -p supabase-backup

      - name: Respaldar roles
        run: supabase db dump --linked -f supabase-backup/roles.sql --role-only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Respaldar estructura
        run: supabase db dump --linked -f supabase-backup/schema.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Respaldar datos
        run: supabase db dump --linked -f supabase-backup/data.sql --data-only --use-copy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Guardar respaldo como archivo privado
        uses: actions/upload-artifact@v4
        with:
          name: Bunnys-INK-Supabase-Backup-v1.2
          path: supabase-backup/
          retention-days: 7
