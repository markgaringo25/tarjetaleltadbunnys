name: Restaurar Supabase - PRUEBA

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # ============================================================
      # DESCARGAR RESPALDO
      # ============================================================

      - name: Descargar respaldo
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: supabase-backup.yml
          workflow_conclusion: success
          name: Bunnys-INK-Supabase-Backup-v1.2
          path: supabase-backup
          search_artifacts: true

      - name: Verificar archivos
        run: |
          echo "Archivos encontrados:"
          find supabase-backup -maxdepth 2 -type f -print

          test -f supabase-backup/schema.sql
          test -f supabase-backup/data.sql

          echo "schema.sql encontrado"
          echo "data.sql encontrado"

      # ============================================================
      # LIMPIAR SOLAMENTE LAS TABLAS DE LA APP EN EL PROYECTO PRUEBA
      #
      # Esto también elimina secuencias, índices, políticas,
      # restricciones y triggers dependientes de estas tablas.
      #
      # NO elimina el esquema auth.
      # NO elimina las funciones public.
      # ============================================================

      - name: Limpiar estructura anterior del PROYECTO DE PRUEBA
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="DROP TABLE IF EXISTS public.customer_rewards, public.stamp_history, public.push_subscriptions, public.push_campaigns, public.loyalty_cards, public.reward_settings, public.profiles CASCADE;"

          echo "Estructura anterior eliminada."

      # ============================================================
      # RESTAURAR ESTRUCTURA ORIGINAL
      # ============================================================

      - name: Restaurar estructura
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --file=supabase-backup/schema.sql

      # ============================================================
      # PREPARAR LOS DATOS DEL RESPALDO
      # ============================================================

      - name: Preparar datos AUTH y PUBLIC
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path("supabase-backup/data.sql")

          users_dst = Path("supabase-backup/data-auth-users.sql")
          identities_dst = Path("supabase-backup/data-auth-identities.sql")
          public_dst = Path("supabase-backup/data-public.sql")

          lines = src.read_text(encoding="utf-8").splitlines(True)

          users = []
          identities = []
          public = []

          mode = None

          for line in lines:
              stripped = line.lstrip()

              if stripped.startswith('COPY "auth"."users" '):
                  mode = "users"
                  users.append(line)
                  continue

              if stripped.startswith('COPY "auth"."identities" '):
                  mode = "identities"
                  identities.append(line)
                  continue

              if stripped.startswith('COPY "public".'):
                  mode = "public"
                  public.append(line)
                  continue

              if stripped.startswith('COPY "auth".'):
                  mode = "skip_auth"
                  continue

              if stripped.startswith("COPY "):
                  mode = "skip_other"
                  continue

              if mode == "users":
                  users.append(line)

                  if line.strip() == r"\.":
                      mode = None

                  continue

              if mode == "identities":
                  identities.append(line)

                  if line.strip() == r"\.":
                      mode = None

                  continue

              if mode == "public":
                  public.append(line)

                  if line.strip() == r"\.":
                      mode = None

                  continue

              if mode in ("skip_auth", "skip_other"):
                  if line.strip() == r"\.":
                      mode = None

                  continue

          users_dst.write_text("".join(users), encoding="utf-8")
          identities_dst.write_text("".join(identities), encoding="utf-8")
          public_dst.write_text("".join(public), encoding="utf-8")

          print("Archivos preparados:")
          print(users_dst)
          print(identities_dst)
          print(public_dst)
          PY

          ls -lh supabase-backup/data-auth-users.sql
          ls -lh supabase-backup/data-auth-identities.sql
          ls -lh supabase-backup/data-public.sql

      # ============================================================
      # LIMPIAR AUTH DEL PROYECTO DE PRUEBA
      # ============================================================

      - name: Limpiar usuarios anteriores de prueba
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="DELETE FROM auth.identities; DELETE FROM auth.users;"

          echo "AUTH limpio."

      # ============================================================
      # RESTAURAR AUTH.USERS
      # ============================================================

      - name: Restaurar AUTH USERS
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --file=supabase-backup/data-auth-users.sql

      # ============================================================
      # RESTAURAR AUTH.IDENTITIES
      # ============================================================

      - name: Restaurar AUTH IDENTITIES
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --file=supabase-backup/data-auth-identities.sql

      # ============================================================
      # EL AUTH TRIGGER PUDO CREAR PROFILES Y TARJETAS.
      # LOS QUITAMOS PARA RESTAURAR LOS ORIGINALES.
      # ============================================================

      - name: Limpiar datos creados automáticamente
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="TRUNCATE TABLE public.customer_rewards, public.stamp_history, public.push_subscriptions, public.push_campaigns, public.loyalty_cards, public.reward_settings, public.profiles RESTART IDENTITY CASCADE;"

          echo "Datos automáticos eliminados."

      # ============================================================
      # DESACTIVAR TRIGGERS DE PROFILES
      #
      # Evita que COPY profiles cree tarjeta #1 automáticamente.
      # ============================================================

      - name: Desactivar triggers de profiles
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="ALTER TABLE public.profiles DISABLE TRIGGER USER;"

          echo "Triggers desactivados temporalmente."

      # ============================================================
      # RESTAURAR PUBLIC
      # ============================================================

      - name: Restaurar datos PUBLIC
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --file=supabase-backup/data-public.sql

      # ============================================================
      # REACTIVAR TRIGGERS SIEMPRE
      # ============================================================

      - name: Reactivar triggers de profiles
        if: always()
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="ALTER TABLE public.profiles ENABLE TRIGGER USER;"

          echo "Triggers reactivados."

      # ============================================================
      # VERIFICACIÓN
      # ============================================================

      - name: Verificar restauracion
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="SELECT 'auth.users' AS tabla, COUNT(*) AS registros FROM auth.users UNION ALL SELECT 'auth.identities', COUNT(*) FROM auth.identities UNION ALL SELECT 'public.profiles', COUNT(*) FROM public.profiles UNION ALL SELECT 'public.loyalty_cards', COUNT(*) FROM public.loyalty_cards UNION ALL SELECT 'public.customer_rewards', COUNT(*) FROM public.customer_rewards UNION ALL SELECT 'public.stamp_history', COUNT(*) FROM public.stamp_history UNION ALL SELECT 'public.reward_settings', COUNT(*) FROM public.reward_settings UNION ALL SELECT 'public.push_subscriptions', COUNT(*) FROM public.push_subscriptions UNION ALL SELECT 'public.push_campaigns', COUNT(*) FROM public.push_campaigns;"

          echo ""
          echo "=========================================="
          echo "RESTAURACION FINALIZADA"
          echo "=========================================="
