name: Restaurar Supabase - PRUEBA

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Descargar respaldo
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: supabase-backup.yml
          workflow_conclusion: success
          name: Bunnys-INK-Supabase-Backup-v1.2
          path: supabase-backup

      - name: Verificar archivos
        run: |
          echo "Archivos encontrados:"
          find supabase-backup -maxdepth 2 -type f -print

          test -f supabase-backup/schema.sql
          test -f supabase-backup/data.sql

          echo "Respaldo encontrado correctamente."

      # ============================================================
      # 1. RESTAURAR ESTRUCTURA PUBLIC
      # ============================================================

      - name: Restaurar estructura en PROYECTO VIEJO
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --file=supabase-backup/schema.sql

      # ============================================================
      # 2. SEPARAR AUTH.USERS, AUTH.IDENTITIES Y PUBLIC
      # ============================================================

      - name: Preparar datos AUTH y PUBLIC
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path("supabase-backup/data.sql")

          if not src.exists():
              raise SystemExit("ERROR: No existe supabase-backup/data.sql")

          lines = src.read_text(encoding="utf-8").splitlines(True)

          auth_users = []
          auth_identities = []
          public_data = []

          current = None

          for line in lines:
              stripped = line.lstrip()

              if stripped.startswith('COPY "auth"."users" '):
                  current = "auth_users"
                  auth_users.append(line)
                  continue

              if stripped.startswith('COPY "auth"."identities" '):
                  current = "auth_identities"
                  auth_identities.append(line)
                  continue

              if stripped.startswith('COPY "public".'):
                  current = "public"
                  public_data.append(line)
                  continue

              if stripped.startswith("COPY "):
                  current = "skip"
                  continue

              if current == "auth_users":
                  auth_users.append(line)
                  if line.strip() == r"\.":
                      current = None
                  continue

              if current == "auth_identities":
                  auth_identities.append(line)
                  if line.strip() == r"\.":
                      current = None
                  continue

              if current == "public":
                  public_data.append(line)
                  if line.strip() == r"\.":
                      current = None
                  continue

          Path("supabase-backup/auth-users.sql").write_text(
              "".join(auth_users),
              encoding="utf-8"
          )

          Path("supabase-backup/auth-identities.sql").write_text(
              "".join(auth_identities),
              encoding="utf-8"
          )

          Path("supabase-backup/data-public.sql").write_text(
              "".join(public_data),
              encoding="utf-8"
          )

          if not auth_users:
              raise SystemExit("ERROR: No se encontró COPY auth.users")

          if not auth_identities:
              raise SystemExit("ERROR: No se encontró COPY auth.identities")

          if not public_data:
              raise SystemExit("ERROR: No se encontraron datos PUBLIC")

          print("auth-users.sql creado correctamente")
          print("auth-identities.sql creado correctamente")
          print("data-public.sql creado correctamente")
          PY

      # ============================================================
      # 3. RESTAURAR AUTH.USERS
      # ============================================================

      - name: Restaurar AUTH USERS
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --file=supabase-backup/auth-users.sql

      # ============================================================
      # 4. RESTAURAR AUTH.IDENTITIES
      # ============================================================

      - name: Restaurar AUTH IDENTITIES
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --file=supabase-backup/auth-identities.sql

      # ============================================================
      # 5. RESTAURAR DATOS PUBLIC
      # ============================================================

      - name: Restaurar datos PUBLIC
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --file=supabase-backup/data-public.sql

      # ============================================================
      # 6. VERIFICACIÓN
      # ============================================================

      - name: Verificar restauracion
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          echo "=========================================="
          echo "USUARIOS AUTH"
          echo "=========================================="

          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --command="SELECT count(*) AS usuarios_auth FROM auth.users;"

          echo "=========================================="
          echo "PERFILES"
          echo "=========================================="

          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --command="SELECT count(*) AS perfiles FROM public.profiles;"

          echo "=========================================="
          echo "TARJETAS"
          echo "=========================================="

          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjvyrnuyagusmjfcrv \
            --dbname=postgres \
            --command="SELECT count(*) AS tarjetas FROM public.loyalty_cards;"

          echo "=========================================="
          echo "RESTAURACION FINALIZADA"
          echo "=========================================="
