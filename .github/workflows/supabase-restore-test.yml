name: Restaurar Supabase - PRUEBA

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Descargar respaldo desde la ejecucion
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: supabase-backup.yml
          workflow_conclusion: success
          name: Bunnys-INK-Supabase-Backup-v1.2
          path: supabase-backup
          search_artifacts: true

      - name: Verificar archivos
        run: |
          echo "Archivos encontrados:"
          ls -lah supabase-backup

      - name: Restaurar estructura en PROYECTO VIEJO
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjyvrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --file=supabase-backup/schema.sql

      - name: Preparar solamente datos PUBLIC
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path("supabase-backup/data.sql")
          dst = Path("supabase-backup/data-public.sql")

          lines = src.read_text(encoding="utf-8").splitlines(True)

          output = []
          copying_public = False
          skipping_copy = False

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("COPY "):
                  if stripped.startswith('COPY "public".'):
                      copying_public = True
                      skipping_copy = False
                      output.append(line)
                  else:
                      copying_public = False
                      skipping_copy = True
                  continue

              if skipping_copy:
                  if stripped == r"\.":
                      skipping_copy = False
                  continue

              if copying_public:
                  output.append(line)

                  if stripped == r"\.":
                      copying_public = False

          dst.write_text("".join(output), encoding="utf-8")

          print("data-public.sql creado correctamente")
          print("Bloques PUBLIC encontrados:")

          for line in output:
              if line.strip().startswith('COPY "public".'):
                  print(line.strip())
          PY

      - name: Restaurar datos PUBLIC
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjyvrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --file=supabase-backup/data-public.sql

      - name: Verificar restauracion
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjyvrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="
              SELECT
                'profiles' AS tabla,
                COUNT(*) AS registros
              FROM public.profiles

              UNION ALL

              SELECT
                'loyalty_cards',
                COUNT(*)
              FROM public.loyalty_cards

              UNION ALL

              SELECT
                'customer_rewards',
                COUNT(*)
              FROM public.customer_rewards

              UNION ALL

              SELECT
                'push_campaigns',
                COUNT(*)
              FROM public.push_campaigns

              UNION ALL

              SELECT
                'push_subscriptions',
                COUNT(*)
              FROM public.push_subscriptions

              UNION ALL

              SELECT
                'reward_settings',
                COUNT(*)
              FROM public.reward_settings

              UNION ALL

              SELECT
                'stamp_history',
                COUNT(*)
              FROM public.stamp_history;
            "
