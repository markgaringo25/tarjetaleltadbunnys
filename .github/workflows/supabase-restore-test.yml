name: Restaurar Supabase - PRUEBA

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Descargar respaldo desde la ejecucion
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: supabase-backup.yml
          workflow_conclusion: success
          name: Bunnys-INK-Supabase-Backup-v1.2
          path: supabase-backup
          search_artifacts: true

      - name: Verificar archivos
        run: |
          echo "Archivos encontrados:"
          ls -lah supabase-backup

      - name: Restaurar estructura en PROYECTO VIEJO
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjyvrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --file=supabase-backup/schema.sql

      - name: Preparar solamente datos PUBLIC
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path("supabase-backup/data.sql")
          dst = Path("supabase-backup/data-public.sql")

          lines = src.read_text(encoding="utf-8").splitlines(True)

          output = []
          skipping = False

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("COPY "):
                  if not stripped.startswith("COPY public."):
                      skipping = True
                      continue

              if skipping:
                  if stripped == r"\.":
                      skipping = False
                  continue

              output.append(line)

          dst.write_text("".join(output), encoding="utf-8")

          print("data-public.sql creado correctamente")
          PY

      - name: Restaurar datos PUBLIC
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjyvrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --file=supabase-backup/data-public.sql

      - name: Verificar restauracion
        env:
          PGPASSWORD: ${{ secrets.OLD_SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host=aws-0-us-east-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.bbgjyvrnuyagusmjfcrv \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="SELECT schemaname, tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;"
