<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d3111b">
<link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunny's INK Tattoos - App</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-color: #080808;
      --primary-red: #d3111b;
      --primary-red-hover: #a80b13;
      --text-white: #ffffff;
      --border-color: #333333;
      --card-bg: #161616;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-white);
    }

    .app-screen {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background-color: var(--bg-color);
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 8px solid #222;
    }

    .background-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 50% 30%, rgba(211, 17, 27, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 50% 80%, rgba(211, 17, 27, 0.15) 0%, transparent 50%);
      z-index: 1;
      pointer-events: none;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px 0;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
    }

    .view {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      z-index: 2;
      overflow-y: auto;
    }

    .view.active {
      display: flex;
    }

    #view-home {
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .logo-badge {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 4px solid #aaa;
      background: radial-gradient(circle, #e6e6e6 0%, #999999 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(211, 17, 27, 0.4);
      margin-top: 30px;
    }

    .logo-small {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid #aaa;
      background: radial-gradient(circle, #e6e6e6 0%, #999999 100%);
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      margin: 0 5px;
      vertical-align: middle;
    }

    .brand-title {
      font-family: 'Georgia', serif;
      font-size: 38px;
      font-weight: 900;
      margin-top: 15px;
    }

    .brand-sub {
      font-size: 42px;
      color: var(--primary-red);
      font-weight: 900;
      font-style: italic;
      margin-top: -5px;
    }

    .slogan {
      color: #cccccc;
      font-size: 12px;
      font-style: italic;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background-color: var(--primary-red);
      color: var(--text-white);
      box-shadow: 0 4px 15px rgba(211, 17, 27, 0.4);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-white);
      border: 1.5px solid var(--border-color);
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--primary-red);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      font-size: 13px;
      color: #aaa;
    }

    .form-group input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-white);
      font-size: 14px;
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--primary-red);
      background-color: #000;
    }

    .scan-result-card {
      background-color: var(--card-bg);
      border-left: 4px solid var(--primary-red);
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: left;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <div class="background-overlay"></div>

    <div class="status-bar">
      <span>9:41</span>
      <span>📶 🔋</span>
    </div>

    <!-- INICIO -->
    <div id="view-home" class="view active">
      <div>
        <div class="logo-badge">
          <span style="font-size: 70px;">🐰</span>
        </div>
        <h1 class="brand-title">Bunny's</h1>
        <h2 class="brand-sub">INK</h2>
        <div class="slogan">
          TATUAJES <span class="logo-small">🐰</span> ARTE <span class="logo-small">🐰</span> PASIÓN
        </div>
      </div>

      <div class="action-container">
        <button class="btn btn-primary" onclick="switchView('view-register')">Registrarse</button>
        <button class="btn btn-secondary" onclick="switchView('view-qr')">📷 Escanear QR</button>
      </div>
    </div>

    <!-- REGISTRO -->
    <div id="view-register" class="view">
      <button class="btn-back" onclick="switchView('view-home')">← Volver</button>
      <h2 style="margin-bottom: 20px;">Registro de Cliente</h2>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" required placeholder="Ej. Carlos Mendoza">
        </div>
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" required placeholder="cliente@email.com">
        </div>
        <div class="form-group">
          <label>Teléfono / WhatsApp</label>
          <input type="tel" required placeholder="+52 81 0000 0000">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Crear Cuenta</button>
      </form>
    </div>

    <!-- ESCÁNER QR -->
    <div id="view-qr" class="view">
      <button class="btn-back" onclick="stopQRAndBack()">← Volver</button>
      <h2 style="margin-bottom: 10px;">Escáner de Código QR</h2>
      <p style="font-size: 13px; color: #aaa; margin-bottom: 20px;">Escanea tarjetas de cliente, folletos o códigos de cita.</p>

      <div id="reader"></div>

      <div id="qr-result" class="scan-result-card" style="display: none;">
        <strong style="color: var(--primary-red);">Contenido detectado:</strong>
        <p id="qr-text" style="margin-top: 5px; font-size: 14px;"></p>
      </div>
    </div>

    <!-- CONFIRMACIÓN -->
    <div id="view-success" class="view" style="text-align: center; justify-content: center; align-items: center;">
      <span style="font-size: 60px;">✅</span>
      <h2 style="margin-top: 15px;">¡Registro Exitoso!</h2>
      <p style="color: #aaa; margin: 10px 0 25px; font-size: 14px;" id="welcome-msg"></p>
      <button class="btn btn-primary" onclick="switchView('view-home')">Ir al Inicio</button>
    </div>

  </div>

  <script>
    let html5QrCode = null;

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');

      if (viewId === 'view-qr') {
        startQRScanner();
      } else if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop();
      }
    }

    function handleRegister(event) {
      event.preventDefault();
      const name = event.target[0].value;
      document.getElementById('welcome-msg').innerText = Bienvenido a Bunny's INK, ${name}. Tu cuenta ha sido activada.;
      switchView('view-success');
      event.target.reset();
    }

    function startQRScanner() {
      document.getElementById('qr-result').style.display = 'none';

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          document.getElementById('qr-result').style.display = 'block';
          document.getElementById('qr-text').innerText = decodedText;
        },
        () => {}
      ).catch(() => {
        document.getElementById('qr-result').style.display = 'block';
        document.getElementById('qr-text').innerText = "Permiso de cámara denegado o dispositivo sin cámara.";
      });
    }

    function stopQRAndBack() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => switchView('view-home')).catch(() => switchView('view-home'));
      } else {
        switchView('view-home');
      }
    }
  </script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('Service Worker registrado con éxito.'))
      .catch((err) => console.log('Error al registrar Service Worker:', err));
  }
</script>

</body>
</html>
