<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunny's INK Tattoos - App</title>
  
  <!-- Archivos PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d3111b">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Librería para el lector QR -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    :root {
      --bg-color: #000000;
      --primary-red: #d3111b;
      --text-white: #ffffff;
      --border-color: #333333;
      --card-bg: #161616;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-white);
    }

    .app-screen {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background-color: var(--bg-color);
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 8px solid #222;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px 0;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    }

    .view {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 60px 20px 20px 20px;
      z-index: 2;
      overflow-y: auto;
    }

    .view.active {
      display: flex;
    }

    /* VISTA DE INICIO CON IMAGEN DE PORTADA */
    #view-home {
      padding: 0;
      position: relative;
      justify-content: flex-end;
    }

    .home-bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    .action-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px 25px 40px 25px;
      z-index: 5;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-align: center;
    }

    .btn-primary {
      background-color: var(--primary-red);
      color: var(--text-white);
      box-shadow: 0 4px 15px rgba(211, 17, 27, 0.5);
    }

    .btn-secondary {
      background-color: rgba(0, 0, 0, 0.6);
      color: var(--text-white);
      border: 1.5px solid var(--border-color);
      backdrop-filter: blur(5px);
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--primary-red);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      font-size: 13px;
      color: #aaa;
    }

    .form-group input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-white);
      font-size: 14px;
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--primary-red);
      background-color: #000;
    }

    .scan-result-card {
      background-color: var(--card-bg);
      border-left: 4px solid var(--primary-red);
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: left;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <div class="status-bar">
      <span>9:41</span>
      <span>📶 🔋</span>
    </div>

    <!-- INICIO -->
    <div id="view-home" class="view active">
      <img src="portada.jpg" alt="Bunny's INK Portada" class="home-bg-image" onerror="this.src='portada.png'">

      <div class="action-container">
        <button class="btn btn-primary" onclick="switchView('view-login')">Iniciar sesión</button>
        <button class="btn btn-secondary" onclick="switchView('view-register')">Registrarse</button>
      </div>
    </div>

    <!-- INICIAR SESIÓN -->

      <button class="btn-back" onclick="switchView('view-home')">← Volver</button>
      <h2 style="margin-bottom: 20px;">Iniciar Sesión</h2>
