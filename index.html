<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bunny's INK Tattoos - App</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d3111b">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Librería QR -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>

    :root {
      --bg-color: #000000;
      --primary-red: #d3111b;
      --text-white: #ffffff;
      --border-color: #333333;
      --card-bg: #161616;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-white);
    }

    /* CONTENEDOR PRINCIPAL */

    .app-screen {
      width: 100%;
      max-width: 390px;
      height: 844px;
      max-height: 100vh;

      background-color: var(--bg-color);

      border-radius: 40px;
      border: 8px solid #222;

      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);

      position: relative;
      overflow: hidden;

      display: flex;
      flex-direction: column;
    }

    /* BARRA SUPERIOR */

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 15px 25px 0;

      font-size: 14px;
      font-weight: 600;

      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      z-index: 100;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.7),
          transparent
        );

      pointer-events: none;
    }

    /* PANTALLAS */

    .view {
      display: none;
      flex-direction: column;

      width: 100%;
      height: 100%;

      padding: 60px 20px 20px;

      position: relative;
      z-index: 10;

      overflow-y: auto;
    }

    .view.active {
      display: flex;
    }

    /* ============================= */
    /* PANTALLA DE INICIO */
    /* ============================= */

    #view-home {
      padding: 0;

      flex-direction: column;
      justify-content: space-between;

      height: 100%;

      background-color: #000;
    }

    .home-bg-container {
      width: 100%;
      flex: 1;

      overflow: hidden;

      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .home-bg-image {
      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      display: block;
    }

    /* BOTONES DE INICIO */

    .action-container {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 12px;

      padding: 15px 25px 35px;

      position: relative;
      z-index: 50;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,1) 30%,
          rgba(0,0,0,0)
        );
    }

    /* BOTONES */

    .btn {
      width: 100%;

      padding: 14px;

      border-radius: 30px;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      border: none;

      text-align: center;

      transition:
        transform 0.1s,
        background-color 0.2s;

      user-select: none;

      -webkit-tap-highlight-color: transparent;

      position: relative;
      z-index: 60;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary-red);
      color: var(--text-white);

      box-shadow:
        0 4px 15px
        rgba(211, 17, 27, 0.5);
    }

    .btn-primary:hover {
      background-color: #ed1722;
    }

    .btn-secondary {
      background-color: rgba(20, 20, 20, 0.9);

      color: var(--text-white);

      border:
        1.5px solid
        var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #202020;
    }

    /* BOTÓN VOLVER */

    .btn-back {
      background: none;
      border: none;

      color: var(--primary-red);

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      text-align: left;

      margin-bottom: 20px;

      padding: 5px 0;
    }

    /* FORMULARIOS */

    .form-group {
      display: flex;
      flex-direction: column;

      gap: 6px;

      margin-bottom: 15px;

      text-align: left;
    }

    .form-group label {
      font-size: 13px;
      color: #aaa;
    }

    .form-group input {
      width: 100%;

      padding: 12px;

      border-radius: 8px;

      border:
        1px solid
        var(--border-color);

      background-color:
        var(--card-bg);

      color:
        var(--text-white);

      font-size: 14px;

      outline: none;
    }

    .form-group input:focus {
      border-color:
        var(--primary-red);
    }

    /* ESCÁNER QR */

    #reader {
      width: 100%;

      border-radius: 12px;

      overflow: hidden;

      border:
        2px solid
        var(--primary-red);

      background-color: #000;
    }

    .scan-result-card {
      background-color:
        var(--card-bg);

      border-left:
        4px solid
        var(--primary-red);

      padding: 15px;

      border-radius: 8px;

      margin-top: 15px;

      text-align: left;

      word-break: break-all;
    }

    /* TELÉFONOS */

    @media (max-width: 430px) {

      body {
        align-items: flex-start;
        background-color: #000;
      }

      .app-screen {
        max-width: none;

        width: 100%;
        height: 100vh;

        border: none;
        border-radius: 0;
      }

    }

  </style>
</head>

<body>


<div class="app-screen">


  <!-- BARRA SUPERIOR -->

  <div class="status-bar">

    <span id="current-time">
      9:41
    </span>

    <span>
      📶 🔋
    </span>

  </div>


  <!-- ========================= -->
  <!-- INICIO -->
  <!-- ========================= -->

  <div
    id="view-home"
    class="view active"
  >

    <div class="home-bg-container">

      <img
        src="portada.jpg"
        alt="Bunny's INK Portada"
        class="home-bg-image"
        onerror="this.onerror=null; this.src='portada.png';"
      >

    </div>


    <div class="action-container">

      <button
        type="button"
        class="btn btn-primary"
        onclick="switchView('view-login')"
      >
        Iniciar sesión
      </button>


      <button
        type="button"
        class="btn btn-secondary"
        onclick="switchView('view-register')"
      >
        Registrarse
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- INICIAR SESIÓN -->
  <!-- ========================= -->

  <div
    id="view-login"
    class="view"
  >

    <button
      type="button"
      class="btn-back"
      onclick="switchView('view-home')"
    >
      ← Volver
    </button>


    <h2 style="margin-bottom:20px;">
      Iniciar Sesión
    </h2>


    <form
      id="login-form"
      onsubmit="handleLogin(event)"
    >

      <div class="form-group">

        <label for="login-email">
          Correo Electrónico
        </label>

        <input
          id="login-email"
          type="email"
          required
          autocomplete="email"
          placeholder="cliente@email.com"
        >

      </div>


      <div class="form-group">

        <label for="login-password">
          Contraseña
        </label>

        <input
          id="login-password"
          type="password"
          required
          autocomplete="current-password"
          placeholder="••••••••"
        >

      </div>


      <button
        type="submit"
        class="btn btn-primary"
        style="margin-top:15px;"
      >
        Ingresar
      </button>

    </form>

  </div>


  <!-- ========================= -->
  <!-- REGISTRO -->
  <!-- ========================= -->

  <div
    id="view-register"
    class="view"
  >

    <button
      type="button"
      class="btn-back"
      onclick="switchView('view-home')"
    >
      ← Volver
    </button>


    <h2 style="margin-bottom:20px;">
      Registro de Cliente
    </h2>


    <form
      id="register-form"
      onsubmit="handleRegister(event)"
    >


      <div class="form-group">

        <label for="register-name">
          Nombre Completo
        </label>

        <input
          id="register-name"
          type="text"
          required
          autocomplete="name"
          placeholder="Ej. Carlos Mendoza"
        >

      </div>


      <div class="form-group">

        <label for="register-email">
          Correo Electrónico
        </label>

        <input
          id="register-email"
          type="email"
          required
          autocomplete="email"
          placeholder="cliente@email.com"
        >

      </div>


      <div class="form-group">

        <label for="register-phone">
          Teléfono / WhatsApp
        </label>

        <input
          id="register-phone"
          type="tel"
          required
          autocomplete="tel"
          placeholder="+52 81 0000 0000"
        >

      </div>


      <div class="form-group">

        <label for="register-password">
          Contraseña
        </label>

        <input
          id="register-password"
          type="password"
          required
          autocomplete="new-password"
          minlength="6"
          placeholder="••••••••"
        >

      </div>


      <button
        type="submit"
        class="btn btn-primary"
        style="margin-top:15px;"
      >
        Crear Cuenta
      </button>

    </form>

  </div>


  <!-- ========================= -->
  <!-- ESCÁNER QR -->
  <!-- ========================= -->

  <div
    id="view-qr"
    class="view"
  >

    <button
      type="button"
      class="btn-back"
      onclick="stopQRAndBack()"
    >
      ← Volver
    </button>


    <h2 style="margin-bottom:10px;">
      Escáner de Código QR
    </h2>


    <p
      style="
        font-size:13px;
        color:#aaa;
        margin-bottom:20px;
      "
    >
      Escanea la tarjeta QR del cliente.
    </p>


    <div id="reader"></div>


    <div
      id="qr-result"
      class="scan-result-card"
      style="display:none;"
    >

      <strong
        style="color:var(--primary-red);"
      >
        Contenido detectado:
      </strong>


      <p
        id="qr-text"
        style="
          margin-top:5px;
          font-size:14px;
        "
      ></p>

    </div>

  </div>


  <!-- ========================= -->
  <!-- CONFIRMACIÓN -->
  <!-- ========================= -->

  <div
    id="view-success"
    class="view"
    style="
      text-align:center;
      justify-content:center;
      align-items:center;
    "
  >

    <span style="font-size:60px;">
      ✅
    </span>


    <h2 style="margin-top:15px;">
      ¡Bienvenido!
    </h2>


    <p
      id="welcome-msg"
      style="
        color:#aaa;
        margin:10px 0 25px;
        font-size:14px;
      "
    ></p>


    <button
      type="button"
      class="btn btn-primary"
      onclick="switchView('view-home')"
    >
      Ir al Inicio
    </button>


    <button
      type="button"
      class="btn btn-secondary"
      style="margin-top:12px;"
      onclick="switchView('view-qr')"
    >
      Abrir escáner QR
    </button>

  </div>


</div>


<script>

  /*
  ========================================
  VARIABLES
  ========================================
  */

  let html5QrCode = null;


  /*
  ========================================
  CAMBIAR DE PANTALLA
  ========================================
  */

  function switchView(viewId) {

    console.log(
      "Cambiando a:",
      viewId
    );


    const views =
      document.querySelectorAll('.view');


    views.forEach(function(view) {

      view.classList.remove('active');

    });


    const targetView =
      document.getElementById(viewId);


    if (!targetView) {

      console.error(
        "No existe la pantalla:",
        viewId
      );

      return;

    }


    targetView.classList.add('active');


    /*
    Iniciar lector QR
    solamente cuando abrimos
    esa pantalla.
    */

    if (viewId === 'view-qr') {

      setTimeout(function() {

        startQRScanner();

      }, 300);

    } else {

      stopQRScanner();

    }

  }


  /*
  ========================================
  INICIAR SESIÓN
  ========================================
  */

  function handleLogin(event) {

    event.preventDefault();


    const email =
      document.getElementById(
        'login-email'
      ).value.trim();


    if (!email) {

      alert(
        'Escribe tu correo electrónico.'
      );

      return;

    }


    document.getElementById(
      'welcome-msg'
    ).textContent =
      'Has iniciado sesión correctamente con ' +
      email +
      '.';


    switchView(
      'view-success'
    );


    event.target.reset();

  }


  /*
  ========================================
  REGISTRAR CLIENTE
  ========================================
  */

  function handleRegister(event) {

    event.preventDefault();


    const name =
      document.getElementById(
        'register-name'
      ).value.trim();


    const email =
      document.getElementById(
        'register-email'
      ).value.trim();


    const phone =
      document.getElementById(
        'register-phone'
      ).value.trim();


    const password =
      document.getElementById(
        'register-password'
      ).value;


    if (
      !name ||
      !email ||
      !phone ||
      !password
    ) {

      alert(
        'Completa todos los campos.'
      );

      return;

    }


    document.getElementById(
      'welcome-msg'
    ).textContent =
      'Bienvenido a Bunny\'s INK, ' +
      name +
      '. Tu registro se realizó correctamente.';


    switchView(
      'view-success'
    );


    event.target.reset();

  }


  /*
  ========================================
  INICIAR ESCÁNER QR
  ========================================
  */

  async function startQRScanner() {

    const result =
      document.getElementById(
        'qr-result'
      );


    const qrText =
      document.getElementById(
        'qr-text'
      );


    result.style.display =
      'none';


    /*
    Comprobar que la librería cargó.
    */

    if (
      typeof Html5Qrcode ===
      'undefined'
    ) {

      result.style.display =
        'block';


      qrText.textContent =
        'No se pudo cargar el lector QR. Comprueba tu conexión a Internet.';


      return;

    }


    try {


      if (!html5QrCode) {

        html5QrCode =
          new Html5Qrcode(
            'reader'
          );

      }


      /*
      Evitar iniciar dos veces
      la cámara.
      */

      if (html5QrCode.isScanning) {

        return;

      }


      await html5QrCode.start(

        {
          facingMode:
            'environment'
        },

        {
          fps: 10,

          qrbox: {
            width: 220,
            height: 220
          }
        },


        function(decodedText) {

          result.style.display =
            'block';


          qrText.textContent =
            decodedText;

        },


        function() {

          /*
          Esta función se ejecuta
          mientras busca un QR.
          No necesitamos mostrar
          los errores de lectura.
          */

        }

      );


    } catch (error) {


      console.error(
        'Error de cámara:',
        error
      );


      result.style.display =
        'block';


      qrText.textContent =
        'No se pudo abrir la cámara. Verifica que hayas dado permiso para usarla.';

    }

  }


  /*
  ========================================
  DETENER ESCÁNER
  ========================================
  */

  async function stopQRScanner() {

    if (
      html5QrCode &&
      html5QrCode.isScanning
    ) {

      try {

        await html5QrCode.stop();

      } catch (error) {

        console.log(
          'El lector QR ya estaba detenido.'
        );

      }

    }

  }


  /*
  ========================================
  VOLVER DESDE QR
  ========================================
  */

  async function stopQRAndBack() {

    await stopQRScanner();

    switchView(
      'view-home'
    );

  }


  /*
  ========================================
  RELOJ
  ========================================
  */

  function updateClock() {

    const now =
      new Date();


    const time =
      now.toLocaleTimeString(
        'es-MX',
        {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }
      );


    const clock =
      document.getElementById(
        'current-time'
      );


    if (clock) {

      clock.textContent =
        time;

    }

  }


  updateClock();


  setInterval(
    updateClock,
    30000
  );


  /*
  ========================================
  COMPROBACIÓN AL CARGAR
  ========================================
  */

  document.addEventListener(
    'DOMContentLoaded',
    function() {

      console.log(
        "Bunny's INK cargado correctamente."
      );

    }
  );


</script>

  <script>
window.switchView = function(viewId) {
    console.log("Abriendo pantalla:", viewId);

    document.querySelectorAll(".view").forEach(function(view) {
        view.classList.remove("active");
    });

    var target = document.getElementById(viewId);

    if (target) {
        target.classList.add("active");
    } else {
        console.error("No existe la pantalla: " + viewId);
    }
};

window.handleLogin = function(event) {
    event.preventDefault();

    var emailInput = document.querySelector("#view-login input[type='email']");

    document.getElementById("welcome-msg").textContent =
        "Has iniciado sesión correctamente con " +
        emailInput.value +
        ".";

    window.switchView("view-success");
};

window.handleRegister = function(event) {
    event.preventDefault();

    var nameInput = document.querySelector("#view-register input[type='text']");

    document.getElementById("welcome-msg").textContent =
        "Bienvenido a Bunny's INK, " +
        nameInput.value +
        ".";

    window.switchView("view-success");
};

console.log("JavaScript Bunny's INK cargado correctamente");
</script>

</body>
</html>
